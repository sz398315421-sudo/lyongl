<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b11">
  <title>陨石带巡航 · 沉浸式航行展示</title>
  <link rel="stylesheet" href="style.css">
  <script src="assets/space-data.js" defer></script>
  <script src="assets/asteroid-models.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main id="game" aria-label="沉浸式航行展示">
    <canvas id="sky" aria-hidden="true"></canvas>
    <canvas id="space" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <canvas id="flight-reference" aria-hidden="true"></canvas>
    <div class="cockpit" aria-hidden="true">
      <img class="cockpit-image" src="assets/cockpit-glass.png" alt="" hidden>
      <div class="strut strut-left"></div>
      <div class="strut strut-right"></div>
      <div class="console"></div>
      <div class="console-lights"></div>
      <canvas id="avionics"></canvas>
    </div>

    <header class="flight-header">
      <div class="heading">
        <p>座舱观景</p>
        <h1>陨石带巡航</h1>
      </div>
      <button id="immersive" type="button" aria-pressed="false">
        <i aria-hidden="true"></i>
        <span>全屏观看</span>
      </button>
    </header>

    <footer id="controls" class="controls">
      <span>自动巡航</span>
      <span class="keyboard-hint"><kbd>WASD</kbd> / <kbd>方向键</kbd> 微调位置</span>
      <span class="touch-hint">拖动画面微调位置</span>
    </footer>
    <p id="error" class="error" hidden>当前浏览器无法打开 3D 画面，请使用支持 WebGL 的浏览器。</p>
    <noscript><p class="error">请启用 JavaScript 后重新打开游戏。</p></noscript>
  </main>
</body>
</html>
