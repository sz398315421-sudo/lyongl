<!doctype html>
<html lang="zh-CN" data-theme="dark" data-nav-design="1">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>压线提醒 · HUD</title>
  <link rel="stylesheet" href="../adas/style.css?v=20261013-scene-polish-111">
  <link rel="stylesheet" href="../adas/workspace.css?v=20261021-screen-format-3">
  <link rel="stylesheet" href="../adas/corners.css?v=20261013-continuous-4">
  <link rel="stylesheet" href="../adas/export.css?v=dialog-motion-1">
  <link rel="stylesheet" href="../adas/ui-typography.css?v=zh-CN-1">
  <link rel="stylesheet" href="../adas/ui-refinements.css?v=20261017">
  <link rel="stylesheet" href="../adas/scene-playback.css?v=20261020-all-lanes-1">
  <link rel="stylesheet" href="../adas/traffic-flow.css?v=20261022-traffic-layout-1">
  <link rel="stylesheet" href="./hud.css?v=subpage-1">
  <link rel="stylesheet" href="./lane-departure.css?v=6">
  <script>
    try {
      if (localStorage.getItem('hud:sr-theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch {}
  </script>
</head>
<body class="hud-workspace hud-subpage">
  <a class="skip-link" href="#main-content">跳转到预览与设置</a>
  <header>
    <button id="scene-picker" type="button" aria-label="选择场景" aria-expanded="false" aria-controls="mobile-scene-menu">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
        <path class="menu-line menu-line-top" d="M2.5 10h15"/><path class="menu-line menu-line-middle" d="M2.5 10h15"/><path class="menu-line menu-line-bottom" d="M2.5 10h15"/>
      </svg>
    </button>
    <div class="brand"><a class="wordmark" href="./">HUD</a></div>
    <div class="control-group appearance-control">
      <a class="studio-tool-link" href="../adas/">返回 ADAS</a>
    </div>
  </header>
  <main id="main-content" tabindex="-1">
    <aside>
      <div id="mobile-scene-menu" inert aria-hidden="true"><div class="mobile-menu-content"><div id="mobile-scene-nav"></div></div></div>
      <nav aria-label="场景列表" id="scenes">
        <section class="scene-group">
          <h2 class="structure-heading">ADAS场景</h2>
          <div class="structure-items"><a class="scene" href="./?scene=02">3车道变道</a><a class="scene" href="./?scene=05">直行过路口</a></div>
        </section>
        <section class="scene-group">
          <h2 class="structure-heading">HUD光毯</h2>
          <div class="structure-items"><a class="scene" href="./?scene=03">光毯变道</a></div>
        </section>
        <section class="scene-group">
          <h2 class="structure-heading">车道线</h2>
          <div class="structure-items">
            <a class="scene" id="departure-navigation" aria-current="page" href="./lane-departure.html">压线提醒</a>
            <a class="scene" id="curve-navigation" href="./lane-departure.html?scene=curve">弯道模拟</a>
          </div>
        </section>
        <section class="scene-group">
          <h2 class="structure-heading">AR箭头</h2>
          <div class="structure-items"><a class="scene" href="./ar-arrow.html">路口右转</a></div>
        </section>
      </nav>
    </aside>
    <section class="workspace" aria-labelledby="scene-title">
      <div class="preview-shell">
        <div class="hud-subpage-heading">
          <h1 id="scene-title">压线提醒</h1>
          <div class="screen-format-toolbar">
            <span id="screen-format-label">屏幕比例</span>
            <div class="view-segments screen-format-options" role="group" aria-labelledby="screen-format-label">
              <button type="button" data-screen-format="16:9" aria-pressed="true">1920 × 1080</button>
              <button type="button" data-screen-format="21:9" aria-pressed="false">2560 × 1080</button>
              <button type="button" data-screen-format="1920x720" aria-pressed="false">1920 × 720</button>
            </div>
          </div>
        </div>
        <div class="preview" id="preview">
          <canvas id="scene-canvas" width="1920" height="1080" role="img" aria-label="识别车道线，两侧蓝色细线"></canvas>
          <span id="lane-dimensions" class="dimensions">1920 × 1080</span>
          <button type="button" id="download" class="download" aria-label="下载" title="下载" disabled>
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5v10m-3.5-3.5 3.5 3.5 3.5-3.5M2.5 13.5v4h15v-4"/></svg>
          </button>
        </div>
        <div class="scene-motion-buttons hud-preview-actions">
          <button type="button" id="hud-immersive" aria-haspopup="dialog" aria-controls="hud-immersive-dialog">沉浸预览</button>
        </div>
      </div>
      <section class="preview-settings lane-settings" aria-labelledby="lane-settings-title">
        <h2 id="lane-settings-title">演示控制</h2>
        <div class="lane-status" id="lane-status" data-state="recognition">
          <span class="lane-status-dot" aria-hidden="true"></span>
          <span id="lane-current-state" role="status">识别车道线</span>
          <span id="lane-remaining" aria-hidden="true" hidden></span>
          <progress id="lane-progress" aria-label="当前状态播放进度" value="0" max="1" hidden></progress>
        </div>
        <div id="departure-controls" class="lane-controls">
          <div class="lane-control">
            <div class="lane-duration"><label for="recognition-duration">识别车道线</label><input type="number" id="recognition-duration" value="3" min="0.5" max="60" step="0.1" required aria-label="识别车道线持续秒数"><span aria-hidden="true">秒</span></div>
            <div class="scene-motion-buttons"><button type="button" data-lane-state="recognition" data-duration="recognition-duration" aria-pressed="true">识别车道线</button></div>
          </div>
          <div class="lane-control">
            <div class="lane-duration"><label for="departure-duration">车道偏离</label><input type="number" id="departure-duration" value="2" min="0.5" max="60" step="0.1" required aria-label="车道偏离持续秒数"><span aria-hidden="true">秒</span></div>
            <div class="scene-motion-buttons"><button type="button" data-lane-state="left" data-duration="departure-duration" aria-pressed="false">向左偏离</button><button type="button" data-lane-state="right" data-duration="departure-duration" aria-pressed="false">向右偏离</button></div>
            <label class="lane-pause"><input type="checkbox" id="pause-on-departure">偏移后暂停</label>
            <div class="scene-motion-buttons" id="lane-resume-control" hidden><button type="button" id="lane-resume">继续播放</button></div>
          </div>
          <div class="lane-control">
            <div class="lane-duration"><label for="lcc-duration">LCC</label><input type="number" id="lcc-duration" value="4" min="0.5" max="60" step="0.1" required aria-label="LCC 持续秒数"><span aria-hidden="true">秒</span></div>
            <div class="scene-motion-buttons"><button type="button" data-lane-state="lcc" data-duration="lcc-duration" aria-pressed="false">启动 LCC</button></div>
          </div>
        </div>
        <div id="curve-controls" class="lane-control lane-curve-controls" hidden>
          <div class="scene-motion-buttons">
            <button type="button" data-lane-state="curve-left" aria-pressed="false">进入左弯</button>
            <button type="button" data-lane-state="curve-right" aria-pressed="false">进入右弯</button>
          </div>
          <div class="scene-motion-buttons"><button type="button" data-lane-state="straight" aria-pressed="false">出弯回正</button></div>
        </div>
        <p class="lane-note" id="departure-note">压线变色后开始倒计时。开启「偏移后暂停」可定格压线画面。</p>
        <details class="lane-camera">
          <summary>摄像机控制</summary>
          <div class="hud-camera-controls" id="lane-camera-controls">
            <div class="scene-motion-buttons"><button type="button">重置相机参数</button></div>
          </div>
        </details>
        <div class="hud-camera-controls lane-width-control">
          <label class="traffic-field">
            <span id="lane-width-label">车道线粗细</span>
            <output for="lane-width" id="lane-width-value">100%</output>
            <input id="lane-width" type="range" min="25" max="300" step="5" value="100" aria-labelledby="lane-width-label">
          </label>
        </div>
        <fieldset class="lane-colors">
          <legend>车道线颜色</legend>
          <div class="lane-color-row" data-lane-color="recognition">
            <label for="lane-recognition-hex">常规车道线</label>
            <div class="hud-color-inputs">
              <input type="color" class="guidance-custom-color" value="#0787ff" aria-label="常规车道线取色">
              <input type="text" class="hud-hex" id="lane-recognition-hex" value="#0787FF" maxlength="7" spellcheck="false" autocomplete="off">
            </div>
          </div>
          <div class="lane-color-row" data-lane-color="warning" data-departure-only>
            <label for="lane-warning-hex">压线提醒</label>
            <div class="hud-color-inputs">
              <input type="color" class="guidance-custom-color" value="#ffba2b" aria-label="压线提醒取色">
              <input type="text" class="hud-hex" id="lane-warning-hex" value="#FFBA2B" maxlength="7" spellcheck="false" autocomplete="off">
            </div>
          </div>
          <div class="lane-color-row" data-lane-color="lcc" data-departure-only>
            <label for="lane-lcc-hex">LCC</label>
            <div class="hud-color-inputs">
              <input type="color" class="guidance-custom-color" value="#4ab1ff" aria-label="LCC 取色">
              <input type="text" class="hud-hex" id="lane-lcc-hex" value="#4AB1FF" maxlength="7" spellcheck="false" autocomplete="off">
            </div>
          </div>
        </fieldset>
      </section>
    </section>
  </main>
  <dialog id="hud-immersive-dialog" aria-label="HUD 沉浸预览，按 Esc 或点击画面退出"></dialog>
  <script type="module" src="./lane-departure.mjs?v=7"></script>
</body>
</html>
