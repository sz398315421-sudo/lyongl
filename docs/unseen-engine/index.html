</style>
<link rel="stylesheet" href="palette.css">
<script>
window.globalData={publicUrl:new URL('./',location.href).href,assetsUrl:new URL('./assets/',location.href).href};
parent.postMessage({type:'unseen:progress',progress:2,stage:'scripts'},location.origin);
// Surface real resource/decoder failures to the host so static mode offers retry.
window.addEventListener('error',event=>{
  const resource=event.target;
  if(resource?.tagName==='SCRIPT'||event.error)parent.postMessage({type:'unseen:error',message:resource?.src?'Unable to load '+resource.src:String(event.error)},location.origin);
},true);
window.addEventListener('unhandledrejection',event=>parent.postMessage({type:'unseen:error',message:String(event.reason)},location.origin));
document.addEventListener('webglcontextlost',()=>parent.postMessage({type:'unseen:error',message:'graphics-context-lost'},location.origin),true);
</script>
